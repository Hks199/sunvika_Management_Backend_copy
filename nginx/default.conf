server {
    listen 80;
    server_name sunvikamanagementhub.sunvika.in;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name sunvikamanagementhub.sunvika.in;

    ssl_certificate /etc/letsencrypt/live/sunvikamanagementhub.sunvika.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sunvikamanagementhub.sunvika.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 25m;

    location / {
        proxy_pass http://app:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
